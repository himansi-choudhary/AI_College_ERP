{% extends 'base.html' %}

{% block content %}

<h2>Test Results</h2>

<table border="1">

<tr>
<th>Subject</th>
<th>Test</th>
<th>Score</th>
<th>AI Suggestion</th>

</tr>

{% for r in results %}

<tr>
<td>{{ r.subject_name }}</td>
<td>{{ r.title }}</td>
<td>{{ r.score }}</td>
<td>
<a href="/student/ai_recommendation/{{ r.test_id }}">
<button>AI Suggestion</button>
</a>
</td>
</tr>

{% endfor %}

</table>

{% endblock %}
