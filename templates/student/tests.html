{% extends 'base.html' %}

{% block content %}

<h2>Available Tests</h2>

<table border="1">

<tr>
<th>Subject</th>
<th>Test</th>
<th>Action</th>
</tr>

{% for t in tests %}

<tr>

<td>{{ t.subject_name }}</td>
<td>{{ t.title }}</td>

<td>
<a href="/student/attempt_test/{{ t.id }}">
Start Test
</a>
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
