{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <h2>Add Questions to Test #{{ test_id }}</h2>
  <p class="text-muted">
    Add multiple MCQ questions. Click "Finish Test" when done.
  </p>

  <form method="POST" class="mb-4">
    <div class="row">
      <div class="col-md-12 mb-3">
        <label for="question" class="form-label">Question</label>
        <input
          type="text"
          class="form-control"
          id="question"
          name="question"
          required
        />
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Option A</label>
        <input type="text" class="form-control" name="a" required />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Option B</label>
        <input type="text" class="form-control" name="b" required />
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Option C</label>
        <input type="text" class="form-control" name="c" required />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Option D</label>
        <input type="text" class="form-control" name="d" required />
      </div>

      <div class="col-md-12 mb-3">
        <label for="correct" class="form-label">Correct Answer</label>
        <select class="form-select" id="correct" name="correct" required>
          <option value="">Select correct option</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn btn-success me-2">➕ Add Question</button>
    <a href="/teacher/dashboard" class="btn btn-primary"
      >✅ Finish Test & Return to Dashboard</a
    >
  </form>

  <div class="alert alert-info">
    <strong>Tip:</strong> Add as many questions as needed, then click "Finish
    Test" when complete.
  </div>
</div>
{% endblock %}
