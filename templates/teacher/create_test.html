{% extends 'base.html' %}

{% block content %}

<h2>Create Test</h2>

<form method="POST">

Test Title<br>
<input type="text" name="title"><br><br>

Subject<br>
<select name="subject_id">

{% for s in subjects %}
<option value="{{ s.id }}">{{ s.subject_name }}</option>
{% endfor %}

</select><br><br>

<button type="submit">Create Test</button>

</form>

{% endblock %}
