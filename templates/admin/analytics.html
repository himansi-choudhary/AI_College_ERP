{% extends 'base.html' %}

{% block content %}

<h2>System Analytics</h2>

<ul>
    <li>Total Students: {{ students }}</li>
    <li>Total Teachers: {{ teachers }}</li>
    <li>Total Tests: {{ tests }}</li>
</ul>

<canvas id="myChart" width="400" height="200"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('myChart').getContext('2d');

const chart = new Chart(ctx, {

    type: 'bar',

    data: {
        labels: ['Students', 'Teachers', 'Tests'],
        datasets: [{
            label: 'System Data',
            data: [{{ students }}, {{ teachers }}, {{ tests }}],
            borderWidth: 1,
            backgroundColor: [
                'rgba(54, 162, 235, 0.6)',
                'rgba(75, 192, 192, 0.6)',
                'rgba(255, 159, 64, 0.6)'
            ],
            borderColor: [
                'rgba(54, 162, 235, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(255, 159, 64, 1)'
            ]
        }]
    },

    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }

});

</script>

{% endblock %}
