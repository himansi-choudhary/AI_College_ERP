{% extends 'base.html' %}

{% block content %}

<h2>Search Students</h2>

<form method="GET">

<input type="text" name="q" placeholder="Search student">
<button type="submit">Search</button>

</form>

<br>

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
</tr>

{% for s in students %}

<tr>
<td>{{ s.id }}</td>
<td>{{ s.username }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
