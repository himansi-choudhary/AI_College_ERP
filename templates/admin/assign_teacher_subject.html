{% extends 'base.html' %} {% block content %}
<h2>Assign Teacher → Academic Year → Class → Subject</h2>

<form method="POST" id="assignForm">
  <label>Teacher:</label>
  <select name="teacher_id" required>
    <option value="">Select Teacher</option>
    {% for t in teachers %}
    <option value="{{ t.id }}">{{ t.name }}</option>
    {% endfor %}
  </select>
  <br />
  <label>Academic Year:</label>
  <select name="academic_year" id="yearSelect" disabled required>
    <option value="">Select Academic Year</option>
    {% for year in all_years %}
    <option value="{{ year }}">{{ year }}</option>
    {% endfor %}
  </select>
  <br />
  <label>Class:</label>
  <select name="class_id" id="classSelect" disabled required>
    <option value="">Select Class</option>
  </select>
  <br />
  <label>Subject:</label>
  <select name="subject_id" id="subjectSelect" disabled required>
    <option value="">Select Subject</option>
  </select>

  <br /><br />
  <button type="submit">Assign Teacher to Subject</button>
</form>

<script>
  const teacherSelect = document.querySelector('select[name="teacher_id"]');
  const yearSelect = document.getElementById("yearSelect");
  const classSelect = document.getElementById("classSelect");
  const subjectSelect = document.getElementById("subjectSelect");

  // 1. Teacher change → load academic years
  teacherSelect.addEventListener("change", function () {
    const teacherId = this.value;

    // Reset dependent dropdowns
    yearSelect.innerHTML = '<option value="">Select Academic Year</option>';
    classSelect.innerHTML = '<option value="">Select Class</option>';
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';
    yearSelect.disabled = true;
    classSelect.disabled = true;
    subjectSelect.disabled = true;

    if (teacherId) {
      // Fetch all academic years
      fetch("/admin/get_academic_years")
        .then((response) => response.json())
        .then((data) => {
          if (data.years && data.years.length > 0) {
            data.years.forEach((year) => {
              const option = document.createElement("option");
              option.value = year;
              option.textContent = year;
              yearSelect.appendChild(option);
            });
            yearSelect.disabled = false;
          }
        })
        .catch((error) => console.error("Error loading years:", error));
    }
  });

  // 2. Year change → load classes for year
  yearSelect.addEventListener("change", function () {
    const year = this.value;

    // Reset dependent dropdowns
    classSelect.innerHTML = '<option value="">Select Class</option>';
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';
    classSelect.disabled = true;
    subjectSelect.disabled = true;

    if (year) {
      // Fetch classes for this year
      fetch(`/admin/get_classes/${encodeURIComponent(year)}`)
        .then((response) => response.json())
        .then((data) => {
          if (data.classes && data.classes.length > 0) {
            data.classes.forEach((cls) => {
              const option = document.createElement("option");
              option.value = cls.id;
              option.textContent = cls.class_name;
              classSelect.appendChild(option);
            });
            classSelect.disabled = false;
          }
        })
        .catch((error) => console.error("Error loading classes:", error));
    }
  });

  // 3. Class change → load available subjects for teacher/class/year
  classSelect.addEventListener("change", function () {
    const teacherId = teacherSelect.value;
    const year = yearSelect.value;
    const classId = this.value;

    // Reset subjects
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';
    subjectSelect.disabled = true;

    if (teacherId && year && classId) {
      // Fetch available subjects (teacher-aware)
      fetch(
        `/admin/get_subjects/${classId}/${encodeURIComponent(year)}/${teacherId}`,
      )
        .then((response) => response.json())
        .then((data) => {
          if (data.subjects && data.subjects.length > 0) {
            data.subjects.forEach((subject) => {
              const option = document.createElement("option");
              option.value = subject.id;
              option.textContent = subject.subject_name;
              subjectSelect.appendChild(option);
            });
            subjectSelect.disabled = false;
          } else {
            // Show message if no available subjects
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No available subjects for this teacher";
            option.disabled = true;
            subjectSelect.appendChild(option);
          }
        })
        .catch((error) => console.error("Error loading subjects:", error));
    }
  });
</script>
{% endblock %}
